worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  client_max_body_size 64m;
  server_tokens off;

  # TLS 1.3 only, modern ciphers, HSTS. Public cert for localhost (SPKI pinned by the clients).
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  upstream api {
    server api:8000;
    keepalive 32;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /certs/public.crt;
    ssl_certificate_key /certs/public.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'" always;

    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

    # Control plane: mTLS between nginx (PEP edge) and the API container.
    location /api/ {
      proxy_pass https://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_ssl_protocols TLSv1.3;
      proxy_ssl_certificate         /certs/nginx-client.crt;
      proxy_ssl_certificate_key     /certs/nginx-client.key;
      proxy_ssl_trusted_certificate /certs/internal-ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_name api;
      proxy_ssl_server_name on;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
