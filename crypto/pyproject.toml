[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ztv-crypto"
version = "1.0.0"
description = "ZeroTrustVault shared cryptographic core, offline Org-CA CLI, audit-chain verifier and headless client"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "argon2-cffi>=23", "PyJWT>=2.8", "httpx>=0.27", "pyotp>=2.9"]

[project.scripts]
ztv-ca = "ztv_crypto.cli:ca_main"
ztv-audit-verify = "ztv_crypto.cli:audit_verify_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ztv_crypto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
